upstream easygo_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;  # media + KB uploads

    root /usr/share/nginx/html;
    index index.html;

    # API
    location /api/ {
        proxy_pass http://easygo_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket / Socket.IO (realtime inbox)
    location /socket.io/ {
        proxy_pass http://easygo_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker and index.html must never be cached, so updates take.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: serve static assets, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
